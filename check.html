<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>资源自检 · Design World</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a0a;color:#e8e8e8;font:14px/1.7 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;padding:24px 18px 60px;max-width:760px;margin:0 auto}
  h1{font-size:17px;font-weight:600;margin-bottom:4px}
  p.sub{color:#8a8a8a;font-size:12.5px;margin-bottom:18px}
  .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #1e1e1e;font-size:13px}
  .name{flex:1;word-break:break-all;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#cfcfcf}
  .meta{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#8a8a8a;white-space:nowrap}
  .st{width:16px;height:16px;border-radius:50%;flex:none;background:#333;font-size:11px;line-height:16px;text-align:center;color:#000}
  .ok{background:#2ecc71}.bad{background:#e74c3c}.wait{background:#444}
  .summary{margin-top:22px;padding:14px 16px;border-radius:10px;background:#141414;border:1px solid #232323;font-size:13px;line-height:1.9}
  .summary b{color:#fff}
  .tip{margin-top:14px;font-size:12px;color:#7f7f7f;line-height:1.8}
</style>
</head>
<body>
<h1>资源自检</h1>
<p class="sub">逐个下载站点的模型数据文件，看哪个文件在这台设备上拿不到。</p>
<div id="list"></div>
<div class="summary" id="sum">检测中…</div>
<div class="tip">说明：绿色 = 完整下载，红色 = 失败/被截断（这就是模型显示"待导入"的原因）。</div>

<script>
const FILES = [
  ['assets/three/three.module.js', 1304820, 'three 引擎'],
  ['assets/geo/shoe.js', 2561536, '鞋 01'],
  ['assets/geo/serpent.js', 7063062, '角色 03'],
  ['assets/geo/fab_hat.js', 2010080, '帽 4.1'],
  ['assets/geo/fab_down.js', 4038684, '衣 4.2'],
  ['assets/geo/fab_jeans.js', 2826555, '裤 4.3'],
  ['assets/geo/drape_hero.js', 4873368, '服装 02 总览'],
  ['assets/geo/drape_s4.js', 10853435, '服装 02 · 衣 2.4'],
  ['assets/img/p001.webp', 26552, '测试图片'],
];

const list = document.getElementById('list');
const rows = {};

FILES.forEach(([path, size, label]) => {
  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = '<i class="st wait"></i><span class="name">' + path +
    '<br><span style="color:#6a6a6a;font-size:11px">' + label + '</span></span><span class="meta">等待</span>';
  list.appendChild(d);
  rows[path] = d;
});

(async function run() {
  let ok = 0, bad = 0;
  for (const [path, expect, label] of FILES) {
    const el = rows[path];
    const st = el.querySelector('.st'), meta = el.querySelector('.meta');
    const t0 = performance.now();
    try {
      const r = await fetch(path, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const buf = await r.arrayBuffer();
      const got = buf.byteLength;
      const dt = ((performance.now() - t0) / 1000).toFixed(1);
      const perfect = got === expect;
      st.className = 'st ' + (perfect ? 'ok' : 'bad');
      st.textContent = perfect ? '✓' : '!';
      meta.innerHTML = (got / 1048576).toFixed(2) + 'MB / ' + (expect / 1048576).toFixed(2) + 'MB<br>' + dt + 's';
      perfect ? ok++ : bad++;
    } catch (e) {
      st.className = 'st bad';
      st.textContent = '×';
      meta.innerHTML = (e.message || '失败').slice(0, 22);
      bad++;
    }
  }
  document.getElementById('sum').innerHTML =
    '完成：<b style="color:#2ecc71">' + ok + '</b> 个正常，<b style="color:#e74c3c">' + bad + '</b> 个失败。<br>' +
    (bad === 0 ? '全部文件都能完整下载 —— 那问题不在网络。' :
     '红色的文件在本机下载不完整，模型因此无法显示。');
})();
</script>
</body>
</html>
